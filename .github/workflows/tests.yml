name: Trading validation

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRADE_MODE: dry
      DISCORD_WEBHOOK_URL: ""
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Install OCR binary
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Compile tracked Python and check dependencies
        run: |
          python - <<'PY'
          import pathlib, py_compile, subprocess
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if name.endswith('.py') and pathlib.Path(name).is_file():
                  py_compile.compile(name,doraise=True)
          PY
          python -m pip check
      - name: Run entire repository suite including trading validation
        run: |
          mkdir -p validation/ci
          python -m pytest -q --junitxml=validation/ci/pytest.xml --cov=lavish_core --cov=ml --cov-branch --cov-report=json:validation/ci/coverage.json
      - name: Block medium and high security scan findings
        run: python -m bandit -r lavish_core ml -ll -f json -o validation/ci/bandit.json
      - name: Import and configuration preflight with dummy credentials
        env:
          ALPACA_API_KEY: test_key
          ALPACA_SECRET_KEY: test_secret
          PATREON_ACCESS_TOKEN: test_token
        run: python system_boot.py
      - name: Preserve test and scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trading-validation-${{ github.sha }}
          path: validation/ci/
          if-no-files-found: warn
          retention-days: 30
