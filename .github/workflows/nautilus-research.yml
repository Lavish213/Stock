name: Isolated Nautilus research smoke

on:
  pull_request:
    paths:
      - 'research/nautilus/**'
      - '.github/workflows/nautilus-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      TRADE_MODE: dry
      DISCORD_WEBHOOK_URL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated research dependencies
        run: |
          python -m pip install -r research/nautilus/requirements-lock.txt
          python -m pip check
      - name: Run synthetic engine matrix without broker adapters
        run: python research/nautilus/batch.py --output validation/nautilus-ci
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nautilus-research-${{ github.sha }}
          path: validation/nautilus-ci/
          if-no-files-found: warn
